{% extends 'base.html' %}
{% block title %}Reservations | DineEase{% endblock %}
{% block content %}
<section class="page-shell" style="padding: 72px 24px 96px; background: #fbf3ea;">
    <div class="container" style="max-width: 1100px; margin: 0 auto;">
        <div style="text-align: center; margin-bottom: 32px;">
            <p style="margin: 0 0 12px; color: #c1502e; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.24rem; text-transform: uppercase;">Reserve Your Spot</p>
            <h1 style="margin: 0; color: #2b1810; font-size: clamp(2.2rem, 4vw, 3.5rem);">Book a Table</h1>
        </div>
        <div style="padding: 24px; border-radius: 20px; background: #fff; box-shadow: 0 12px 28px rgba(43, 24, 16, 0.06);">
            <p style="margin: 0; color: #5a463d; font-size: 1.02rem; line-height: 1.8; text-align: center;">
                Plan your next gathering with us and enjoy a warm, memorable dining experience.
            </p>
        </div>
    </div>
</section>
{% endblock %}
